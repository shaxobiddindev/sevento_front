[package]
name = "sevento"
version = "0.1.0"
description = "Sevento — savdo, ombor, nasiya va kassa (desktop)"
authors = ["Sevento"]
license = "UNLICENSED"
edition = "2024"
rust-version = "1.90"

[lib]
name = "sevento_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
# Oddiy API so'rovlari (Bearer). Cookie jari o'chirilgan: refresh cookie faqat auth.rs da.
tauri-plugin-http = { version = "2.8.1", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }
# Faqat Rust tomonida ishlatiladi (JS ga ruxsat berilmaydi): saqlash oynasi, tizim dasturida ochish
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
reqwest = { version = "0.12.16", default-features = false, features = ["rustls-tls", "http2", "charset"] }
cookie_store = { version = "0.22", default-features = false, features = ["serde_json"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
