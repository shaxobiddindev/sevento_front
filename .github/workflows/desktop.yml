name: Desktop (Tauri)

# PR da: Rust kodi tekshiruvi (fmt, clippy). Teg (v*) yoki qo'lda: Linux, Windows, macOS paketlari.
# Server manzili build paytida beriladi: qo'lda ishga tushirishda `api_url`, tegda
# repository o'zgaruvchisi `SEVENTO_API_URL` (Settings → Variables). Kod imzolash — keyinroq.

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'scripts/tauri.mjs'
      - '.github/workflows/desktop.yml'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Server manzili (https://...)'
        required: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tizim kutubxonalari
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # generate_context! frontend fayllarini kutadi
      - run: npm run build
        env:
          TAURI_ENV_PLATFORM: linux
      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust testlari
        working-directory: src-tauri
        run: cargo test

  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Tizim kutubxonalari (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run tauri:build
        env:
          VITE_API_URL: ${{ inputs.api_url || vars.SEVENTO_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: sevento-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
