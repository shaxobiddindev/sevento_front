name: E2E

# Brauzer e2e (Playwright): backend (sevento_back) + Postgres + Redis + Celery ko'tariladi, frontend
# build + vite preview. Og'ir — qo'lda yoki har kecha. Backend repo yopiq bo'lsa, unga o'qish huquqli
# token `BACKEND_REPO_TOKEN` secret sifatida kerak. Rahbar paroli har ishga tushishda tasodifiy.

on:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *' # Toshkent bo'yicha 02:20

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sevento
          POSTGRES_USER: sevento
          POSTGRES_PASSWORD: sevento
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sevento"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://sevento:sevento@127.0.0.1:5432/sevento
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_TRUSTED_ORIGINS: http://localhost:4173
      BOOTSTRAP_ADMIN_USERNAME: admin
      # e2e ko'p marta kiradi — sinov muhitida login cheklovi yumshoq
      THROTTLE_LOGIN: 1000/min
      E2E_BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shaxobiddindev/sevento_back
          ref: ${{ vars.BACKEND_REF || 'main' }}
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}

      - name: Tasodifiy sirlar (faqat shu ishga tushish uchun)
        run: |
          echo "DJANGO_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          PASS="$(openssl rand -hex 12)"
          echo "::add-mask::$PASS"
          echo "BOOTSTRAP_ADMIN_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Backend (PDF uchun tizim kutubxonalari, migratsiya, bootstrap)
        working-directory: backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core
          pip install -r requirements/base.txt
          python manage.py migrate --noinput
          python manage.py bootstrap
      - name: Backend va Celery ni fonda ishga tushirish
        working-directory: backend
        run: |
          nohup uvicorn config.asgi:application --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          nohup celery -A config worker -l info --concurrency 2 > ../celery.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/health/ && break; sleep 2; done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frontend build va preview
        run: |
          npm run build
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/ >/dev/null && break; sleep 1; done
      - run: npx playwright install --with-deps chromium
      - name: E2E
        run: npx playwright test
        env:
          E2E_FRONTEND_DIR: ${{ github.workspace }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-hisobot
          path: |
            playwright-report/
            test-results/
            backend.log
            celery.log
          retention-days: 7
